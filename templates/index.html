<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Local ChatGPT 🤖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #343541;
    color: #ececf1;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    height: 100vh;
}

/* ───── SIDEBAR ───── */
.sidebar {
    width: 260px;
    background: #202123;
    padding: 12px;
    display: flex;
    flex-direction: column;
}

.sidebar h2 {
    font-size: 16px;
    margin: 0 0 12px;
}

.new-chat {
    background: #343541;
    border: 1px solid #4d4d4f;
    color: white;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
}

.new-chat:hover {
    background: #40414f;
}

/* ───── MAIN ───── */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* ───── CHAT ───── */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
}

.message {
    max-width: 800px;
    margin: 0 auto 20px;
    display: flex;
    gap: 12px;
}

.avatar {
    width: 32px;
    height: 32px;
    border-radius: 4px;
    background: #10a37f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.user .avatar { background: #6366f1; }

.bubble {
    white-space: pre-wrap;
    line-height: 1.5;
}

/* THINK BLOCK */
details {
    max-width: 800px;
    margin: 10px auto;
    color: #aaa;
    font-size: 14px;
}

details summary {
    cursor: pointer;
}

/* ───── INPUT ───── */
.input-box {
    border-top: 1px solid #4d4d4f;
    padding: 16px;
}

.input-wrap {
    max-width: 800px;
    margin: auto;
    background: #40414f;
    border-radius: 8px;
    display: flex;
    padding: 10px;
}

textarea {
    flex: 1;
    background: none;
    border: none;
    color: white;
    resize: none;
    outline: none;
    font-size: 15px;
}

button {
    background: #10a37f;
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
}

button:hover { background: #0e8f6e; }

@media (max-width: 700px) {
    .sidebar { display: none; }
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>🤖 Local ChatGPT</h2>
    <button class="new-chat" onclick="clearChat()">＋ Новый чат</button>
</div>

<div class="main">
    <div class="chat" id="chat"></div>

    <div class="input-box">
        <div class="input-wrap">
            <textarea id="input" rows="1" placeholder="Напиши сообщение..."
            onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); send()}"></textarea>
            <button onclick="send()">➤</button>
        </div>
    </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function addMessage(text, who) {
    const msg = document.createElement("div");
    msg.className = "message " + who;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = who === "user" ? "🧑" : "🤖";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;

    return bubble;
}

function addThinkingBlock(think) {
    if (!think) return;

    const block = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "🤖 Размышления (нажмите, чтобы раскрыть)";

    const content = document.createElement("pre");
    content.textContent = think;
    content.style.whiteSpace = "pre-wrap";

    block.appendChild(summary);
    block.appendChild(content);
    chat.appendChild(block);
}

function streamText(element, text) {
    const words = text.split(" ");
    let i = 0;

    const interval = setInterval(() => {
        element.textContent += (i === 0 ? "" : " ") + words[i];
        chat.scrollTop = chat.scrollHeight;
        i++;
        if (i >= words.length) clearInterval(interval);
}, 40);
}

function send() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    const thinking = addMessage("Думает…", "ai");

    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: text})
    })
    .then(r => r.json())
    .then(d => {
        thinking.parentElement.remove();
        addThinkingBlock(d.think);
        const bubble = addMessage("", "ai");
        streamText(bubble, d.answer);
    });
}

function clearChat() {
    chat.innerHTML = "";
}
</script>

</body>
</html>
